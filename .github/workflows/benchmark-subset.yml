name: ranked subset

# Yukon dispatches this file with no inputs. The job is the reusable
# ranked shape; this wrapper exists so the subset track has its own
# workflow filename for runner.workflow.
on:
  workflow_dispatch:

# Neither the wrapper nor the reusable job needs to modify contents.
permissions:
  contents: read

# Keep at most one ranked subset run active for a given ref.
concurrency:
  group: qsb-subset-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    permissions:
      contents: read
    uses: ./.github/workflows/benchmark.yml
    with:
      bench: subset
      runner-label: starkware-subset-rtx4090
